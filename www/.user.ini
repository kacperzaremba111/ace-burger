; Domyślne ustawienia ciasteczka sesji na poziomie ini — dodatkowa warstwa
; obok programowego session_set_cookie_params() w src/Session.php (który
; i tak nadpisuje te wartości per-request, poprawnie wykrywając HTTP/HTTPS
; — patrz komentarz w Session.php). To zabezpieczenie na wypadek, gdyby
; jakiś przyszły kod kiedyś wywołał session_start() z pominięciem Session::start().
session.cookie_httponly = 1
session.cookie_samesite = Strict
